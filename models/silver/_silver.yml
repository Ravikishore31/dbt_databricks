version: 2

unit_tests:
  - name: test_order_amount_cal
    model: silver_orders
    given:
      - input: ref('bronze_orders')
        format: csv
        rows:  |
          id,quantity,unit_price
          1,10,100.00
          2,5,4.00

    expect:
      format: csv
      rows: |
        id,order_amount
        1,1000.00
        2,20.00