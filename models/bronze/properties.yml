version: 2

models:
  - name: bronze_products
    columns:
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: ["Gizmo", "Gadget", "Doohickey", "Widget"]

      - name: id
        data_tests:
          - relationships:
              arguments:
                to: ref('bronze_orders')
                field: product_id